name: Coverage (main)

# The one CodeScene publisher. CodeScene accepts `cs-coverage upload` only
# for analysed branches, so main's coverage is uploaded here after each
# merge; pull requests measure coverage and ratchet it in ci.yml without
# talking to CodeScene at all. This workflow also writes the ratchet
# baseline: caches saved on main are readable by every pull-request run,
# so the baseline written here is the one each pull request is compared
# against, and ci.yml's generate-coverage selection has to match the one
# below field for field. tests/workflow_contracts holds that shape.
#
# workflow_dispatch lets the upload be re-run on demand, because merges
# made by the automerge workflow's GITHUB_TOKEN fire no push event.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One publisher generation per ref at a time, never cancelled. GitHub
# keeps at most one pending run per group, so runs on main never overlap,
# and a replaced pending run is always replaced by a newer trigger whose
# commit is the newest main, so triggered runs (push and dispatch) upload
# in commit order. A manual re-run of an older run is an operator action:
# it republishes that commit's coverage and baseline until the next push
# supersedes it. The group is
# keyed on the ref alone, so a branch dispatch cannot replace a pending
# push to main; a dispatch on main that replaces one leaves the ratchet
# baseline a commit behind until the next push, which is accepted.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          python-source: ./ghillie
          baseline-python-file: .coverage-baseline.python-main-owned
          format: cobertura
          output-path: coverage.xml
          pytest-workers: ''
          with-ratchet: 'true'

      # Whether the token exists, learnt without binding it: the expression
      # is evaluated before the shell runs, so no step holds the secret.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        # The ref as well as the token: a dispatch can name any branch, and
        # without this guard it would upload that branch's coverage as main's.
        # The token goes in only as the input: the uploader is a composite
        # action, and a step `env` would reach every action nested in it.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
