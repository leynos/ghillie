name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install yaml schema validator
        env:
          PAJV_VERSION: '1.2.0'
        run: bun install -g "pajv@${PAJV_VERSION}"

      - name: Install CLI tools
        env:
          # Pin every tool this job installs. `uv tool install ruff` followed
          # upstream into a release that formats Python inside Markdown fences
          # and turned main red at "Check formatting". ruff is not installed
          # here any more: the Makefile runs one pinned ruff for every gate.
          MBAKE_VERSION: '1.4.6'
        run: |
          uv tool install "mbake==${MBAKE_VERSION}"

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Run architecture and lint checks
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Coverage is generated here only for pull requests; coverage-main.yml
      # generates and uploads the authoritative main-branch coverage on
      # push, so a push-triggered run of this job would otherwise generate
      # coverage twice for the same commit.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@152d9c4784d0ae5877938a984fe6d1f04d718fd8
        with:
          language: python
          python-source: ./ghillie
          baseline-python-file: .coverage-baseline.python-main-owned
          format: cobertura
          output-path: coverage.xml
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Run tests
        if: github.event_name != 'pull_request'
        run: uv run pytest -v -n auto
