name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # `cs-coverage check` (added in a follow-up once CodeScene's
          # gates configuration is available for this project) diffs the
          # PR against its merge base, so full history must stay
          # reachable; this matches CodeScene's documented example.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install yaml schema validator
        env:
          PAJV_VERSION: '1.2.0'
        run: bun install -g "pajv@${PAJV_VERSION}"

      - name: Install CLI tools
        env:
          # Pin every tool this job installs. `uv tool install ruff` followed
          # upstream into a release that formats Python inside Markdown fences
          # and turned main red at "Check formatting". ruff is not installed
          # here any more: the Makefile runs one pinned ruff for every gate.
          MBAKE_VERSION: '1.4.6'
          MARKDOWNLINT_CLI2_VERSION: '0.23.2'
        run: |
          uv tool install "mbake==${MBAKE_VERSION}"
          npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Check spelling
        run: make spelling

      - name: Run architecture and lint checks
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Coverage is generated here only for pull requests; coverage-main.yml
      # generates and uploads the authoritative main-branch coverage on
      # push, so a push-triggered run of this job would otherwise generate
      # coverage twice for the same commit.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          format: cobertura
          output-path: coverage.xml
          with-ratchet: 'true'

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/74419
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

      - name: Run tests
        if: github.event_name != 'pull_request'
        run: uv run pytest -v -n auto
